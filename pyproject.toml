[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabricator"
version = "0.0.0"
requires-python = ">=3.11"

[project.scripts]
fabricator = "fabricator.cli:main"

[tool.setuptools.packages.find]
where = ["apps/cli"]
include = ["fabricator*"]
namespaces = false
