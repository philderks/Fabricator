
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .console-root {
    background: #0f0f0f;
    min-height: 600px;
    display: flex;
    flex-direction: column;
    font-family: 'Syne', sans-serif;
    color: #e0e0e0;
    padding: 0;
  }

  .console-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 12px;
    border-bottom: 1px solid #1e1e1e;
    flex-shrink: 0;
  }

  .console-title-area {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .console-title {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #a0a0a0;
  }

  .server-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    padding: 2px 8px;
    color: #f97316;
    letter-spacing: 0.04em;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 2px rgba(34,197,94,0.15);
    flex-shrink: 0;
  }

  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .filter-group {
    display: flex;
    gap: 4px;
  }

  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid #2a2a2a;
    background: transparent;
    cursor: pointer;
    transition: all 0.12s;
    text-transform: uppercase;
  }

  .filter-btn[data-level="ALL"] { color: #888; }
  .filter-btn[data-level="ALL"].active { background: #252525; border-color: #3a3a3a; color: #e0e0e0; }

  .filter-btn[data-level="INFO"] { color: #4a9eff88; }
  .filter-btn[data-level="INFO"].active { background: rgba(74,158,255,0.08); border-color: rgba(74,158,255,0.3); color: #4a9eff; }

  .filter-btn[data-level="WARN"] { color: #f9731688; }
  .filter-btn[data-level="WARN"].active { background: rgba(249,115,22,0.08); border-color: rgba(249,115,22,0.3); color: #f97316; }

  .filter-btn[data-level="ERROR"] { color: #ef444488; }
  .filter-btn[data-level="ERROR"].active { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.3); color: #ef4444; }

  .filter-btn[data-level="DEBUG"] { color: #a855f788; }
  .filter-btn[data-level="DEBUG"].active { background: rgba(168,85,247,0.08); border-color: rgba(168,85,247,0.3); color: #a855f7; }

  .divider-v {
    width: 1px;
    height: 18px;
    background: #2a2a2a;
    margin: 0 4px;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 1px solid #2a2a2a;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    color: #666;
    font-size: 12px;
  }

  .icon-btn:hover { background: #1e1e1e; color: #a0a0a0; border-color: #333; }
  .icon-btn.active { background: rgba(249,115,22,0.1); border-color: rgba(249,115,22,0.3); color: #f97316; }

  .scroll-lock-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 3px 9px;
    border-radius: 3px;
    border: 1px solid #2a2a2a;
    background: transparent;
    cursor: pointer;
    transition: all 0.12s;
    color: #555;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .scroll-lock-btn.locked {
    background: rgba(249,115,22,0.08);
    border-color: rgba(249,115,22,0.3);
    color: #f97316;
  }

  .lock-icon {
    width: 9px;
    height: 9px;
  }

  .terminal-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .terminal-body {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 12px 0 4px;
    scrollbar-width: thin;
    scrollbar-color: #2a2a2a transparent;
  }

  .terminal-body::-webkit-scrollbar { width: 4px; }
  .terminal-body::-webkit-scrollbar-track { background: transparent; }
  .terminal-body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

  .log-line {
    display: grid;
    grid-template-columns: 80px 46px 140px 1fr;
    gap: 0 12px;
    padding: 1.5px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    line-height: 1.65;
    transition: background 0.06s;
    cursor: default;
  }

  .log-line:hover { background: rgba(255,255,255,0.02); }

  .log-time { color: #3d3d3d; white-space: nowrap; }
  .log-thread { color: #3a3a3a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .log-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    padding: 1px 0;
    text-align: center;
    width: 42px;
    border-radius: 2px;
  }

  .badge-INFO  { color: #4a9eff; }
  .badge-WARN  { color: #f97316; }
  .badge-ERROR { color: #ef4444; font-weight: 500; }
  .badge-DEBUG { color: #a855f7; }

  .log-msg { color: #c0c0c0; word-break: break-word; }
  .log-line.level-WARN .log-msg  { color: #d4956a; }
  .log-line.level-ERROR .log-msg { color: #e87070; }
  .log-line.level-DEBUG .log-msg { color: #8a6fa8; }
  .log-line.level-INFO .log-msg  { color: #c0c0c0; }

  .log-line.level-ERROR { background: rgba(239,68,68,0.03); }
  .log-line.level-WARN  { background: rgba(249,115,22,0.02); }

  .cursor-blink {
    display: inline-block;
    width: 6px;
    height: 13px;
    background: #f97316;
    opacity: 0;
    animation: blink 1.1s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 2px;
  }
  @keyframes blink { 0%,100%{opacity:0} 50%{opacity:0.7} }

  .new-logs-badge {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: #1c1c1c;
    border: 1px solid #2e2e2e;
    border-radius: 20px;
    padding: 5px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #f97316;
    cursor: pointer;
    display: none;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.04em;
    transition: opacity 0.15s;
    z-index: 10;
  }

  .new-logs-badge.visible { display: flex; }

  .cmd-bar {
    border-top: 1px solid #1e1e1e;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #111111;
    flex-shrink: 0;
  }

  .cmd-prompt {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #f97316;
    user-select: none;
    flex-shrink: 0;
  }

  .cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #e0e0e0;
    caret-color: #f97316;
    letter-spacing: 0.02em;
  }

  .cmd-input::placeholder { color: #333; }

  .cmd-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #333;
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .cmd-send-btn {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 1px solid #2a2a2a;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    transition: all 0.12s;
    flex-shrink: 0;
  }
  .cmd-send-btn:hover { background: #1e1e1e; color: #f97316; border-color: rgba(249,115,22,0.3); }
  .cmd-send-btn.ready { border-color: rgba(249,115,22,0.4); color: #f97316; background: rgba(249,115,22,0.07); }

  .clear-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: #333;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0 4px;
    text-transform: uppercase;
    transition: color 0.12s;
    flex-shrink: 0;
  }
  .clear-btn:hover { color: #666; }
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Fabricator console page — live server log terminal with command input</h2>

<div class="console-root" id="root">

  <div class="console-topbar">
    <div class="console-title-area">
      <div class="status-dot"></div>
      <span class="console-title">Console</span>
      <span class="server-pill">survival-smp</span>
    </div>

    <div class="topbar-controls">
      <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" data-level="ALL">All</button>
        <button class="filter-btn" data-level="INFO">Info</button>
        <button class="filter-btn" data-level="WARN">Warn</button>
        <button class="filter-btn" data-level="ERROR">Error</button>
        <button class="filter-btn" data-level="DEBUG">Debug</button>
      </div>

      <div class="divider-v"></div>

      <button class="scroll-lock-btn locked" id="scrollLockBtn" title="Toggle scroll lock">
        <svg class="lock-icon" viewBox="0 0 10 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.5" y="5" width="7" height="6.5" rx="1" stroke="currentColor" stroke-width="1.2"/>
          <path d="M3 5V3.5a2 2 0 014 0V5" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        <span id="scrollLockLabel">Locked</span>
      </button>

      <div class="divider-v"></div>

      <button class="icon-btn" id="clearBtn" title="Clear console">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="terminal-wrap">
    <div class="terminal-body" id="terminal"></div>
    <div class="new-logs-badge" id="newLogsBadge">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1v8M2 6l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      new lines
    </div>
  </div>

  <div class="cmd-bar">
    <span class="cmd-prompt">/&gt;</span>
    <input class="cmd-input" id="cmdInput" type="text" placeholder="enter command…" autocomplete="off" spellcheck="false" />
    <span class="cmd-hint">↑↓ history · enter send</span>
    <button class="clear-btn" id="clearInputBtn">clear</button>
    <button class="cmd-send-btn" id="sendBtn" title="Send command">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 6h10M7 2l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

</div>

<script>
const LOGS = [
  { time: "12:04:01", level: "INFO",  thread: "Server thread",    msg: "Starting minecraft server version 1.21.1" },
  { time: "12:04:01", level: "INFO",  thread: "Server thread",    msg: "Loading properties" },
  { time: "12:04:01", level: "DEBUG", thread: "Server thread",    msg: "Loaded 0 advancements" },
  { time: "12:04:02", level: "INFO",  thread: "Server thread",    msg: "Default game type: SURVIVAL" },
  { time: "12:04:02", level: "INFO",  thread: "Server thread",    msg: "Generating keypair" },
  { time: "12:04:02", level: "INFO",  thread: "mod loading",      msg: "Fabric Loader 0.15.11 loading mods…" },
  { time: "12:04:03", level: "INFO",  thread: "mod loading",      msg: "Loading 24 mods: fabricator-api, lithium, starlight, carpet, sodium-extra…" },
  { time: "12:04:04", level: "WARN",  thread: "mod loading",      msg: "Mod 'create-fabric' requires 'flywheel' >=0.6 but found 0.5.1" },
  { time: "12:04:05", level: "INFO",  thread: "Server thread",    msg: "Preparing level 'world'" },
  { time: "12:04:05", level: "DEBUG", thread: "Worker-Main-3/4",  msg: "Worldgen: registering 1,420 biome features" },
  { time: "12:04:07", level: "INFO",  thread: "Server thread",    msg: "Preparing start region for dimension minecraft:overworld" },
  { time: "12:04:09", level: "INFO",  thread: "Server thread",    msg: "Done (3.221s)! For help, type 'help'" },
  { time: "12:04:09", level: "INFO",  thread: "Server thread",    msg: "RCON disabled" },
  { time: "12:05:11", level: "INFO",  thread: "Server thread",    msg: "Notchian joined the game" },
  { time: "12:05:12", level: "INFO",  thread: "Server thread",    msg: "Notchian[/192.168.1.42:52431] logged in at (128.5, 64.0, -15.2)" },
  { time: "12:06:00", level: "WARN",  thread: "Server thread",    msg: "Can't keep up! Is the server overloaded? Running 52ms behind (26 ticks)" },
  { time: "12:06:44", level: "INFO",  thread: "Server thread",    msg: "jeb_ joined the game" },
  { time: "12:07:03", level: "ERROR", thread: "Server thread",    msg: "Encountered an unexpected exception — java.lang.NullPointerException at net.minecraft.server.level.ServerLevel.tickChunk" },
  { time: "12:07:03", level: "ERROR", thread: "Server thread",    msg: "at net.minecraft.server.level.ServerLevel.lambda$tickChunk$1(ServerLevel.java:416)" },
  { time: "12:07:04", level: "INFO",  thread: "Server thread",    msg: "jeb_ lost connection: Disconnected" },
  { time: "12:07:04", level: "WARN",  thread: "chunk io",         msg: "Abnormal termination of chunk worker, saving chunk data before exit" },
  { time: "12:07:05", level: "INFO",  thread: "Server thread",    msg: "Server recovery: chunk region reloaded successfully" },
  { time: "12:08:22", level: "DEBUG", thread: "Netty Client IO",  msg: "Channel pipeline registered [id: 0x3fa1c290]" },
  { time: "12:08:22", level: "INFO",  thread: "Server thread",    msg: "jeb_ joined the game" },
  { time: "12:09:10", level: "INFO",  thread: "Server thread",    msg: "Saving the game (this may take a moment!)" },
  { time: "12:09:11", level: "INFO",  thread: "Server thread",    msg: "Saved the game" },
];

const terminal = document.getElementById('terminal');
const cmdInput = document.getElementById('cmdInput');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const clearInputBtn = document.getElementById('clearInputBtn');
const scrollLockBtn = document.getElementById('scrollLockBtn');
const scrollLockLabel = document.getElementById('scrollLockLabel');
const newLogsBadge = document.getElementById('newLogsBadge');
const filterGroup = document.getElementById('filterGroup');

let logs = [...LOGS];
let activeFilter = 'ALL';
let scrollLocked = true;
let cmdHistory = [];
let historyIdx = -1;
let pendingNewLogs = 0;

function formatLine(entry) {
  const div = document.createElement('div');
  div.className = `log-line level-${entry.level}`;
  div.dataset.level = entry.level;
  div.innerHTML = `<span class="log-time">${entry.time}</span><span class="log-badge badge-${entry.level}">${entry.level}</span><span class="log-thread">${entry.thread}</span><span class="log-msg">${entry.msg}</span>`;
  return div;
}

function renderLogs() {
  terminal.innerHTML = '';
  const filtered = activeFilter === 'ALL' ? logs : logs.filter(l => l.level === activeFilter);
  filtered.forEach(l => terminal.appendChild(formatLine(l)));
  if (scrollLocked) terminal.scrollTop = terminal.scrollHeight;
}

function scrollToBottom() {
  terminal.scrollTop = terminal.scrollHeight;
  pendingNewLogs = 0;
  newLogsBadge.classList.remove('visible');
}

renderLogs();

filterGroup.addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  filterGroup.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.level;
  renderLogs();
});

scrollLockBtn.addEventListener('click', () => {
  scrollLocked = !scrollLocked;
  scrollLockLabel.textContent = scrollLocked ? 'Locked' : 'Unlocked';
  scrollLockBtn.classList.toggle('locked', scrollLocked);
  if (scrollLocked) scrollToBottom();
});

terminal.addEventListener('scroll', () => {
  const atBottom = terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 8;
  if (atBottom && pendingNewLogs > 0) {
    pendingNewLogs = 0;
    newLogsBadge.classList.remove('visible');
  }
});

newLogsBadge.addEventListener('click', scrollToBottom);

clearBtn.addEventListener('click', () => {
  logs = [];
  terminal.innerHTML = '';
});

clearInputBtn.addEventListener('click', () => { cmdInput.value = ''; cmdInput.focus(); updateSendBtn(); });

function addCommandLine(cmd) {
  const entry = { time: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}), level: 'INFO', thread: 'CMD', msg: `> ${cmd}` };
  logs.push(entry);
  const el = formatLine(entry);
  el.querySelector('.log-msg').style.color = '#f97316';
  if (activeFilter === 'ALL' || activeFilter === 'INFO') {
    terminal.appendChild(el);
    if (scrollLocked) terminal.scrollTop = terminal.scrollHeight;
    else { pendingNewLogs++; newLogsBadge.querySelector('span') && (newLogsBadge.querySelector('span').textContent = pendingNewLogs + ' new'); newLogsBadge.classList.add('visible'); }
  }
}

function sendCommand() {
  const val = cmdInput.value.trim();
  if (!val) return;
  cmdHistory.unshift(val);
  historyIdx = -1;
  addCommandLine(val);
  cmdInput.value = '';
  updateSendBtn();
}

function updateSendBtn() {
  sendBtn.classList.toggle('ready', cmdInput.value.trim().length > 0);
}

cmdInput.addEventListener('input', updateSendBtn);

cmdInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { sendCommand(); return; }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx < cmdHistory.length - 1) { historyIdx++; cmdInput.value = cmdHistory[historyIdx]; updateSendBtn(); }
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx > 0) { historyIdx--; cmdInput.value = cmdHistory[historyIdx]; }
    else { historyIdx = -1; cmdInput.value = ''; }
    updateSendBtn();
  }
});

sendBtn.addEventListener('click', sendCommand);

const liveLines = [
  { level: "INFO",  thread: "Server thread", msg: "Autosave complete — 842 chunks written" },
  { level: "WARN",  thread: "Server thread", msg: "Player Notchian has high ping (420ms)" },
  { level: "INFO",  thread: "Server thread", msg: "Notchian: gg" },
  { level: "DEBUG", thread: "Netty IO",      msg: "Keepalive packet sent to Notchian" },
  { level: "INFO",  thread: "Server thread", msg: "Backup scheduled in 5 minutes" },
];
let liveIdx = 0;
setInterval(() => {
  if (liveIdx >= liveLines.length) return;
  const now = new Date();
  const entry = { ...liveLines[liveIdx++], time: now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) };
  logs.push(entry);
  if (activeFilter === 'ALL' || activeFilter === entry.level) {
    const el = formatLine(entry);
    terminal.appendChild(el);
    if (scrollLocked) {
      terminal.scrollTop = terminal.scrollHeight;
    } else {
      pendingNewLogs++;
      newLogsBadge.querySelector('svg').nextSibling.textContent = ` ${pendingNewLogs} new line${pendingNewLogs>1?'s':''}`;
      newLogsBadge.classList.add('visible');
    }
  }
}, 2800);
</script>
