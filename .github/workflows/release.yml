# .github/workflows/release.yml

name: Build & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.detect.outputs.is_prerelease }}
    steps:
      - name: Detect pre-release tag
        id: detect
        run: |
          if [[ "${{ github.event.release.tag_name }}" =~ -[a-zA-Z] ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  build-linux:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble tarball
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          STAGING="staging/fabricator"

          mkdir -p "$STAGING/frontend"

          # Backend
          rsync -a --exclude='__pycache__/' --exclude='*.pyc' \
            backend/ "$STAGING/backend/"

          # Root entrypoint + deps
          cp run.py requirements.txt pyproject.toml "$STAGING/"

          # CLI + installer
          rsync -a --exclude='__pycache__/' --exclude='*.pyc' \
            tools/ "$STAGING/tools/"

          # Pre-built frontend
          cp -r frontend/dist "$STAGING/frontend/dist"

          # Version marker
          echo "$VERSION" > "$STAGING/.fabricator_version"

          tar -czf "fabricator-${VERSION}.tar.gz" -C staging fabricator

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: fabricator-${{ github.event.release.tag_name }}.tar.gz
          fail_on_unmatched_files: true
          prerelease: ${{ needs.check.outputs.is_prerelease }}

  build-windows:
    runs-on: windows-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Write version marker
        shell: bash
        run: echo "${{ github.event.release.tag_name }}" > .fabricator_version

      - name: Generate PyInstaller spec
        run: python tools/generate_spec.py

      - name: Build executable
        run: python -m PyInstaller fabricator.spec --clean --noconfirm

      - name: Rename artifact
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          mv dist/Fabricator.exe "dist/Fabricator-${VERSION}.exe"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Fabricator-${{ github.event.release.tag_name }}.exe
          fail_on_unmatched_files: true
          prerelease: ${{ needs.check.outputs.is_prerelease }}

  build-docker:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU            # emulation for the linux/arm64 runtime stage
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/philderks/fabricator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          # latest=auto tags :latest on every NON-prerelease semver tag. It does
          # NOT compare against existing/higher tags, so re-publishing an older
          # patch (e.g. a v1.2.x hotfix after v1.3.0) moves :latest backwards.
          # Fine for the normal forward-release flow; revisit if back-publishing
          # becomes routine.

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64   # drop arm64 for amd64-only builds
          push: true
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max