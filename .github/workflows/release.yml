# .github/workflows/release.yml

name: Build & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble tarball
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          STAGING="staging/fabricator"

          mkdir -p "$STAGING/frontend"

          # Backend
          rsync -a --exclude='__pycache__/' --exclude='*.pyc' \
            backend/ "$STAGING/backend/"

          # Root entrypoint + deps
          cp run.py requirements.txt "$STAGING/"

          # Pre-built frontend
          cp -r frontend/dist "$STAGING/frontend/dist"

          # Version marker
          echo "$VERSION" > "$STAGING/.fabricator_version"

          tar -czf "fabricator-${VERSION}.tar.gz" -C staging fabricator

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: fabricator-${{ github.event.release.tag_name }}.tar.gz
          fail_on_unmatched_files: true

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Write version marker
        shell: bash
        run: echo "${{ github.event.release.tag_name }}" > .fabricator_version

      - name: Generate PyInstaller spec
        run: python tools/generate_spec.py

      - name: Build executable
        run: python -m PyInstaller fabricator.spec --clean --noconfirm

      - name: Rename artifact
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          mv dist/Fabricator.exe "dist/Fabricator-${VERSION}.exe"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Fabricator-${{ github.event.release.tag_name }}.exe
          fail_on_unmatched_files: true