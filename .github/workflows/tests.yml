name: Tests

# Gate for merges to main: the backend suite must pass. Mark the "pytest" job
# as a required status check in the branch protection rule for main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the suite
        run: python -m pytest -q
