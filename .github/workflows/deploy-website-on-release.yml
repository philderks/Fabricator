name: Trigger Fabricator website deploy on release

on:
  workflow_run:
    workflows: ["Build & Release"]
    types:
      - completed
  workflow_dispatch:

jobs:
  trigger-cloudflare-pages-deploy:
    name: Trigger Cloudflare Pages deploy hook
    runs-on: ubuntu-latest
    # A skipped MCP-tagged Build & Release run is still a completed workflow.
    # Guard its upstream tag independently so it cannot redeploy the panel site.
    if: ${{ (github.event.workflow_run.conclusion == 'success' && !startsWith(github.event.workflow_run.head_branch, 'mcp-v')) || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Validate deploy hook secret is configured
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK_URL is not set."
            echo "Add the Cloudflare Pages deploy hook URL as a repository secret in GitHub."
            exit 1
          fi

      - name: Trigger Cloudflare Pages deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          echo "Triggering Cloudflare Pages deploy for release: $RELEASE_TAG"
          curl --fail --show-error --silent \
            -X POST \
            "$DEPLOY_HOOK_URL"
